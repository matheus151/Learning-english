<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>English Pro</title>
<meta name="description" content="Cards de inglês do dia a dia: ouvir, traduzir, destacar, gerar exemplos e revisar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Pro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f7f7fa; --text:#1c1c1e; --strong:#000; --muted:#6e6e73;
  --line:rgba(60,60,67,.14); --accent:#2563eb; --accent-soft:rgba(37,99,235,.12); --on-accent:#fff;
  --tr:#15803d; --tr-bg:#f0fdf4; --tr-line:#bbf7d0; --hl:rgba(250,204,21,.55); --danger:#e5484d;
  --sel:rgba(37,99,235,.22); --sec:#64748b; --gen:#7c3aed; --gen-bg:rgba(124,58,237,.07); --gen-line:rgba(124,58,237,.3); --gen-hl:rgba(167,139,250,.45); --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
  --fs:19px; --radius:18px;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --card2:#26262a; --text:#f2f2f7; --strong:#fff; --muted:#98989f;
  --line:rgba(84,84,88,.55); --tr:#4ade80; --tr-bg:rgba(34,197,94,.10); --tr-line:rgba(34,197,94,.28);
  --hl:rgba(250,204,21,.32); --shadow:none;
  --sec:#94a3b8; --gen:#b79cff; --gen-bg:rgba(167,139,250,.12); --gen-line:rgba(167,139,250,.35); --gen-hl:rgba(167,139,250,.38);
}
:root[data-theme="sepia"]{
  --bg:#efe6d2; --card:#fbf5e6; --card2:#f3ead6; --text:#3b2f20; --strong:#1f170c; --muted:#7a6a55;
  --line:rgba(94,72,40,.18); --tr:#4d6b1f; --tr-bg:#eef0d9; --tr-line:#d4d9a8; --hl:rgba(232,165,52,.45);
  --sec:#7a6a55; --gen:#7a4fb8; --gen-bg:rgba(122,79,184,.08); --gen-line:rgba(122,79,184,.3); --gen-hl:rgba(160,120,220,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
a{color:var(--accent)}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;padding:calc(var(--top) + 6px) 16px 8px;background:var(--bg);border-bottom:.5px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.top-row{display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto;min-height:44px}
.top-title{flex:1;min-width:0}
.top-title h1{margin:0;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.top-title .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.top-actions{display:flex;gap:6px}
.tb{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb.primary{background:var(--accent);color:var(--on-accent)}
.searchbar{max-width:720px;margin:8px auto 0;position:relative}
.searchbar input{width:100%;height:40px;border-radius:12px;border:0;background:var(--card);padding:0 36px 0 38px;box-shadow:var(--shadow);outline:none}
.searchbar svg{position:absolute;left:11px;top:10px;color:var(--muted);width:18px;height:18px}
.searchbar .clear{position:absolute;right:6px;top:6px;width:28px;height:28px;display:grid;place-items:center;color:var(--muted)}

main{max-width:720px;margin:0 auto;padding:8px 16px calc(96px + var(--bot))}
.view{animation:fade .2s ease-out}
@keyframes fade{from{opacity:.4}to{opacity:1}}

/* ---------- Cards ---------- */
#cards{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:var(--radius);padding:14px 16px 12px;box-shadow:var(--shadow);position:relative;scroll-margin-top:calc(var(--top) + 76px)}
.card::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--stripe,var(--accent));opacity:.85}
.card.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent-soft)}100%{box-shadow:var(--shadow)}}
.card-head{display:flex;align-items:center;gap:8px;margin:-4px -6px 4px 0;min-height:30px}
.num{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge.gray{color:var(--muted);background:var(--card2)}
.card-head .grow{flex:1;min-width:0;display:flex;gap:6px;overflow:hidden}
.ib{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:active{background:var(--card2)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.ib.del{color:var(--muted)}
.ib svg{width:18px;height:18px}

.sent{position:relative}
.en{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;word-wrap:break-word;overflow-wrap:anywhere}
.main .en{flex:1;min-width:0;font-size:calc(var(--fs) * 1.12);line-height:1.42;font-weight:500;color:var(--main-c,var(--strong));padding:2px 0 8px}
.main .en b,.main .w.b,.main .sp.b{color:var(--main-c,var(--strong))}
.sec .en{color:var(--sec-c,inherit)}
.sec .en b,.sec .w.b,.sec .sp.b{color:var(--sec-c,var(--strong))}
.card .main .sent-row{background:var(--main-bg,var(--accent-soft));border-radius:12px;padding:8px 10px;margin-bottom:10px}
.card .main .sent-row .en{padding:0}
.ex-toggle{flex:none;display:flex;align-items:center;gap:2px;height:34px;min-width:34px;margin:0 -6px 0 2px;padding:0 6px;justify-content:center;border-radius:999px;color:var(--muted)}
.ex-toggle:active{background:var(--card2)}
.ex-toggle svg{transition:transform .15s}
.ex-count{display:none;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.card.ex-closed .ex-toggle svg{transform:rotate(-90deg)}
.card.ex-closed .ex-count{display:inline}
.card.ex-closed .ex-wrap{display:none}
.w{border-radius:3px}
.w.b,.sp.b,.en b{font-weight:800;color:var(--strong);background:linear-gradient(transparent 58%,var(--hl) 58%)}
.en:not([data-w]) b{pointer-events:none}
.w.sel,.sp.sel{background:var(--sel)!important}
.sent.speaking .en{color:var(--accent)}
.sent.speaking .w.b,.sent.speaking .en b{color:var(--accent)}
.main-tools{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:var(--card2);color:var(--text);font-size:14px;font-weight:600;white-space:nowrap}
.pill svg{width:17px;height:17px}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.pill.accent{background:var(--accent);color:var(--on-accent)}
.pill.ghost{background:transparent;color:var(--accent);padding:0 8px}
.pill.danger{color:var(--danger)}
.pill:disabled{opacity:.55}
.tr{margin-top:8px;padding:9px 12px;border-radius:12px;background:var(--tr-bg);color:var(--tr);font-size:calc(var(--fs) * .84);line-height:1.4;border:1px dashed var(--tr-line)}
.tr .muted,.muted{color:var(--muted)}
.tr .err{color:var(--danger)}
.ex-wrap{margin-top:12px;border-top:1px solid var(--line)}
.ex-wrap.sec .sent.ex{border-left:3px solid var(--sec-c,var(--sec));padding-left:10px;margin:6px 0;border-bottom:0}
.ex-wrap.sec .ex-label{color:var(--sec-c,var(--sec))}
.ex-wrap.gen{border-top:1px dashed var(--gen-line)}
.ex-wrap.gen .ex-label{color:var(--gen);align-items:center}
.ex-wrap.gen .ex-label svg{width:14px;height:14px}
.ex-wrap.gen .sent.ex{background:var(--gen-bg);border-left:3px solid var(--gen);border-radius:0 12px 12px 0;padding:7px 0 7px 10px;margin:6px 0;border-bottom:0}
.ex-wrap.gen .sent.ex .w.b,.ex-wrap.gen .sent.ex .sp.b,.ex-wrap.gen .sent.ex .en b{background:linear-gradient(transparent 58%,var(--gen-hl) 58%)}
.alt-tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--gen);background:var(--card);border:1px solid var(--gen-line);border-radius:999px;padding:1px 8px;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:7px 12px;border-radius:12px;background:var(--accent-soft);color:var(--text);font-size:15px;text-align:left}
.chip b{color:var(--accent)}
.chip span{font-size:12.5px;color:var(--muted)}
.ctx-mains{margin:4px 0 0;padding-left:20px;font-size:15.5px;line-height:1.45}
.ctx-sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:12px}
.ex-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 0 2px;display:flex;gap:6px}
.ex-label span{font-weight:600;opacity:.7}
.sent.ex{padding:7px 0;border-bottom:1px solid var(--line)}
.sent.ex:last-child{border-bottom:0}
.sent-row{display:flex;gap:4px;align-items:flex-start}
.sent.ex .en{flex:1;font-size:var(--fs);line-height:1.45;padding-top:5px}
.sent.ex .tools{display:flex;margin-right:-8px}
.sent.ex .tr{margin-top:4px;margin-right:0}
.sent.ex.new{animation:newex 1.6s ease-out}
@keyframes newex{0%{background:var(--accent-soft)}100%{background:transparent}}
.card-foot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.card-foot .sp-auto{flex:1}
details.note{margin-top:10px;font-size:14px;color:var(--muted)}
details.note summary{cursor:pointer;font-weight:600;list-style:none}
details.note summary::-webkit-details-marker{display:none}
details.note div{white-space:pre-line;margin-top:6px;padding:8px 10px;background:var(--card2);border-radius:10px}

.tip{background:var(--accent-soft);color:var(--text);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.tip b{color:var(--accent)}
.tip .ib{margin:-6px -8px -6px 0}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty h3{color:var(--text);margin:0 0 6px;font-size:20px}
.empty .pill{margin-top:16px}

/* ---------- Tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:6px 8px calc(var(--bot) + 4px);background:var(--card);border-top:.5px solid var(--line)}
.tabbar-in{display:flex;width:100%;max-width:520px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:10.5px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--accent)}
.tab .dot{position:absolute;top:0;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;font-weight:700}

/* ---------- Sheets ---------- */
.sheet-ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);transition:background .25s;display:flex;align-items:flex-end;justify-content:center}
.sheet-ov.open{background:rgba(0,0,0,.38)}
.sheet{width:100%;max-width:720px;max-height:calc(100% - var(--top) - 24px);background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;position:relative}
.sheet-ov.open .sheet{transform:none}
.sheet-head{flex:none;position:relative;z-index:5;height:44px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 8px}
.grab{position:absolute;left:50%;top:8px;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--line)}
.sheet-x{width:40px;height:40px;background:var(--card);color:var(--text)}
.sheet-body{position:relative;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px calc(var(--bot) + 20px)}
.sheet-title{font-size:20px;font-weight:800;margin:0 0 12px}
.hint{font-size:13.5px;color:var(--muted);margin:6px 0 10px}
.field{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
textarea,.input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;outline:none;resize:vertical}
textarea:focus,.input:focus{border-color:var(--accent)}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;background:var(--card);font-weight:700;font-size:16px;margin-top:12px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55}
.menu{background:var(--card);border-radius:14px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left;font-size:16px;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu button svg{color:var(--accent)}
.menu button.danger,.menu button.danger svg{color:var(--danger)}
.menu-head{font-size:14px;color:var(--muted);margin:0 2px 12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.edit-ex{display:flex;gap:6px;align-items:flex-start;margin-bottom:8px}
.edit-ex textarea{flex:1}

/* Context sheet */
.term-form{display:flex;gap:8px}
.term-form .input{flex:1}
.ctx-sent{margin:12px 0 4px;padding:10px 12px;border-radius:12px;background:var(--card);font-size:15px;line-height:1.45;color:var(--muted)}
.ctx-sent mark{background:var(--hl);color:var(--strong);font-weight:700;border-radius:3px;padding:0 1px}
.ctx-sent.small{font-size:14px;margin:8px 0}
.ctx-card{background:var(--card);border-radius:16px;padding:14px 16px;margin-top:12px}
.ctx-term{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctx-term h3{margin:0;font-size:24px;font-weight:800;color:var(--strong)}
.ctx-mean{font-size:19px;font-weight:700;color:var(--tr);margin:6px 0 4px}
.ctx-expl{font-size:15.5px;line-height:1.5}
.ctx-other{font-size:14px;color:var(--muted);margin-top:8px}
.def{padding:8px 0;border-bottom:1px solid var(--line)}
.def:last-child{border-bottom:0}
.def .pos{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:20px 4px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* Terms */
.term-head{display:flex;gap:8px;align-items:flex-start}
.term-head .grow{flex:1;min-width:0}
.term-name{font-size:calc(var(--fs) * 1.15);font-weight:800;color:var(--strong);line-height:1.25}
.term-mean{font-size:calc(var(--fs) * .95);color:var(--tr);font-weight:600;margin-top:4px}
.term-expl{font-size:15px;line-height:1.5;margin-top:6px}

/* Review */
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.group{background:var(--card);border-radius:16px;padding:4px 16px;box-shadow:var(--shadow);margin-bottom:16px}
.group-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 4px 8px}
.set-row{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .lbl{flex:1;min-width:0}
.set-row .lbl small{display:block;color:var(--muted);font-size:13px}
.set-row select,.set-row .input{max-width:58%;border:1px solid var(--line);border-radius:10px;background:var(--card2);height:38px;padding:0 10px}
.set-row .input{max-width:none;flex:1}
input[type=range]{width:100%;accent-color:var(--accent)}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.2s}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+span{background:#34c759}
.switch input:checked+span::after{transform:translateX(20px)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.swatch.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.swatch.custom{position:relative;overflow:hidden;background:conic-gradient(#ef4444,#f59e0b,#22c55e,#06b6d4,#6366f1,#ec4899,#ef4444)}
.swatch.custom.on{overflow:visible;background:var(--c)}
.swatch.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0}
.color-row{display:block}
.color-row .swatches{margin-top:10px;align-items:center;gap:7px;flex-wrap:nowrap}
.color-row .swatch{width:28px;height:28px;flex:none}
.color-default{flex:none;height:28px;padding:0 10px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600;color:var(--muted)}
.color-default.on{background:var(--accent-soft);color:var(--accent)}
.color-sample{font-size:var(--fs);line-height:1.35;margin-top:8px}
.topics{padding:0 16px}
.topic{display:flex;align-items:center;gap:8px;width:100%;min-height:50px;text-align:left;font-size:16.5px;font-weight:600;border-bottom:1px solid var(--line)}
.topic:last-child{border-bottom:0}
.topic .grow{flex:1;min-width:0}
.topic .muted{font-size:14px;font-weight:600}
.vocab-head{display:flex;align-items:center;margin:0 -8px 2px}
.vocab-title{font-size:24px;font-weight:800;margin:0 0 12px;letter-spacing:-.01em}
.rv-card{background:var(--card);border-radius:22px;padding:22px 18px;box-shadow:var(--shadow);min-height:260px;display:flex;flex-direction:column}
.rv-progress{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:4px 0 14px}
.rv-progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.rv-front{font-size:calc(var(--fs) * 1.2);line-height:1.4;font-weight:600;color:var(--strong)}
.rv-front.pt{color:var(--tr)}
.rv-back{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.rv-rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rv-rate button{background:var(--card);border-radius:14px;padding:10px 4px;font-weight:700;font-size:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:2px}
.rv-rate button small{font-weight:600;font-size:11.5px;color:var(--muted)}
.rv-rate .g0{color:var(--danger)}.rv-rate .g1{color:#d97706}.rv-rate .g2{color:#16a34a}.rv-rate .g3{color:var(--accent)}
.rv-meta{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;justify-content:space-between}

/* Toast & stop */
#toast{position:fixed;left:50%;bottom:calc(var(--bot) + 78px);transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;background:#1c1c1e;color:#fff;border-radius:14px;padding:11px 14px;font-size:14.5px;display:flex;gap:14px;align-items:center;transition:.25s;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
:root[data-theme="dark"] #toast{background:#3a3a3c}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#7cb4ff;font-weight:700}
#stopSpeak{position:fixed;right:16px;bottom:calc(var(--bot) + 78px);z-index:40;display:flex;align-items:center;gap:6px;height:42px;padding:0 16px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#stopSpeak svg{width:16px;height:16px;fill:currentColor}
.fs-preview{font-size:var(--fs);padding:10px 0 4px;color:var(--strong)}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--card2);padding:1px 5px;border-radius:5px}

<body>

<header class="topbar" id="topbar">
  <div class="top-row">
    <div class="top-title"><h1 id="title">Cards</h1><div class="sub" id="sub"></div></div>
    <div class="top-actions" id="topActions"></div>

  <div class="searchbar" id="searchbar" hidden>
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

    <button class="clear" data-act="clear-search" aria-label="Limpar"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>

<input type="file" id="fileIn" accept=".json,application/json,text/plain" hidden>

<script>
'use strict';
/* ================= Utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plain = s => String(s || '').replace(/\*\*/g, '').replace(/\s+/g, ' ').trim();
const norm = s => plain(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}' ]/gu, '').trim();
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Não foi possível salvar (armazenamento cheio?). Faça um backup.'); return false; } },
  raw(k) { try { return localStorage.getItem(k); } catch { return null; } },
  setRaw(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }
};

const ICONS = {
  vol: '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  tr: '<svg viewBox="0 0 24 24"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>',
  spark: '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.8L12 16.5l-1.8-5L5 9.7l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  vocab: '<svg viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>',
  chev: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
  cards: '<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="3"/><path d="M6 3.5h12"/></svg>',
  review: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>',
  book: '<svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
  gear: '<svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>',
  up: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  bookmarkPlus: '<svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/><path d="M12 7v6M9 10h6"/></svg>',
  arrowUp: '<svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>',
  wand: '<svg viewBox="0 0 24 24"><path d="m15 4 5 5"/><path d="M3 21 15.5 8.5"/><path d="M12 3v2M19 10h2M17.5 4.5 19 3"/></svg>',
  history: '<svg viewBox="0 0 24 24"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/></svg>'
};
// Cada ícone é desenhado uma vez (sprite) e os botões só referenciam com <use>: bem menos elementos na página
const I = {};
document.body.insertAdjacentHTML('afterbegin', '<svg width="0" height="0" style="position:absolute" aria-hidden="true">' + Object.entries(ICONS).map(([k, v]) => {
  I[k] = `<svg viewBox="0 0 24 24"><use href="#i-${k}"/></svg>`;
  return v.replace('<svg viewBox="0 0 24 24">', `<symbol id="i-${k}" viewBox="0 0 24 24">`).replace('</svg>', '</symbol>');
}).join('') + '</svg>');
let curView = 'cards', query = '';
const STRIPES = ['#2563eb', '#dc2626', '#16a34a', '#d97706', '#9333ea', '#0891b2'];

/* ================= Settings ================= */
const SET_KEY = 'englishPro2Settings';
const DEF = { aiFree: true, mainBg: '', mainColor: '', secColor: '', theme: 'auto', fs: 19, rate: 1, voice: '', showTr: false, accent: '#2563eb', ai: 'auto', revDir: 'en', revSrc: 'cards', revAuto: true, newPerDay: 15, autoComplete: true, tipDone: false, lastBackup: 0 };
let S = Object.assign({}, DEF, LS.get(SET_KEY, {}));
if (LS.raw(SET_KEY) == null) {
  // herda preferências da versão antiga (V38)
  const ofs = parseFloat(LS.raw('englishAppFontSize'));
  if (ofs) S.fs = Math.max(14, Math.min(30, Math.round(ofs * 16)));
  if (LS.raw('englishAppDarkMode') === 'true') S.theme = 'dark';
  const ov = LS.raw('englishAppGlobalVoiceName');
  if (ov) S.voice = ov;
}
const saveS = () => LS.set(SET_KEY, S);

/* ================= Data / migration ================= */
const DB_KEY = 'englishPro2';
const OLD_KEYS = ['englishCardsFinalV38_8', 'englishCardsFinalV34', 'englishCardsFinalV30', 'englishCardsFinalV29', 'englishCardsFinalV26', 'englishCardsFinalV25'];
const newSent = (en, tr = '') => ({ id: uid(), en: String(en || '').trim(), tr: tr || '' });
const newCard = (en, tr = '') => ({ id: uid(), main: newSent(en, tr), ex: [], created: Date.now() });

// Converte marcações antigas (*azul* #vermelho# ~lilás~ ^negrito^ ==x== **x**) em **negrito**
function convertMarks(s) {
  return String(s || '')
    .replace(/\*\*(.+?)\*\*/g, '\u0001$1\u0002')
    .replace(/==(.+?)==/g, '\u0001$1\u0002')
    .replace(/<b>(.*?)<\/b>/gi, '\u0001$1\u0002')
    .replace(/\^(.+?)\^/g, '\u0001$1\u0002')
    .replace(/#(.+?)#/g, '\u0001$1\u0002')
    .replace(/~(.+?)~/g, '\u0001$1\u0002')
    .replace(/\*(.+?)\*/g, '\u0001$1\u0002')
    .replace(/[\u0001\u0002]/g, '**')
    .replace(/\*\*\*\*/g, '')
    .replace(/\*\*\s*\*\*/g, ' ');
}
const PREFIX_RE = /^\s*(?:[-•–]\s*|\d+[.)]\s*|🇺🇸\s*|🇬🇧\s*|🇧🇷\s*)?(?:(?:(?:another\s+|other\s+|outro\s+)?ex[ae]mples?|exemplos?)\s*\d*\s*[:.\-–]|ex\.?\s*\d*\s*[:.])\s*/i;
const stripPrefix = s => String(s || '').replace(PREFIX_RE, '').replace(/^\s*(?:🇺🇸|🇬🇧|🇧🇷)\s*/, '').trim();

function migrateOldCard(o) {
  if (!o || typeof o.phrase !== 'string') return null;
  const lines = o.phrase.split('\n').map(l => stripPrefix(convertMarks(l))).filter(l => plain(l));
  if (!lines.length) return null;
  const trLines = String(o.translation || '').split('\n').map(l => stripPrefix(l)).filter(l => l.trim());
  const c = newCard(lines[0]);
  c.ex = lines.slice(1).map(l => newSent(l));
  if (trLines.length && trLines.length === lines.length) {
    c.main.tr = trLines[0];
    c.ex.forEach((s, i) => s.tr = trLines[i + 1]);
  } else if (trLines.length) {
    c.note = String(o.translation).trim();
  }
  if (o.id) c.oldId = o.id;
  if (typeof o.id === 'number' && o.id > 1e12) c.created = Math.floor(o.id);
  return c;
}
function readOldKey(k) { try { const a = JSON.parse(LS.raw(k) || 'null'); return Array.isArray(a) ? a : null; } catch { return null; } }
function isOldSample(arr) { return arr.length === 1 && /Use (==|\^)bold/.test(arr[0].phrase || ''); }

let db = LS.get(DB_KEY, null);
let migrationNote = '';
if (!db || !Array.isArray(db.cards)) {
  db = { v: 2, cards: [], terms: [], stats: {}, created: Date.now() };
  for (const k of OLD_KEYS) {
    const arr = readOldKey(k);
    if (arr && arr.length && !isOldSample(arr)) {
      db.cards = arr.map(migrateOldCard).filter(Boolean);
      db.migratedFrom = k;
      migrationNote = `${db.cards.length} cards importados da versão anterior. Nada foi apagado.`;
      break;
    }
  }
  if (!db.cards.length) {
    db.cards = [
      ["I'm **running late**, I'll be there in ten minutes.", ['Sorry, **running late** — traffic is crazy today.', "She's always **running late** for work."]],
      ["**It's up to you**, I'm fine with either place.", ["Pizza or sushi? **It's up to you**.", "Whether you come or not **is up to you**."]],
      ["We should **hang out** this weekend.", ['Do you want to **hang out** after work?', 'We used to **hang out** at the beach every summer.']]
    ].map(([m, ex]) => { const c = newCard(m); c.ex = ex.map(e => newSent(e)); return c; });
  }
  LS.set(DB_KEY, db);
}
db.terms = db.terms || []; db.stats = db.stats || {};
if (db.simsV !== 2) { db.cards.forEach(c => { delete c.sims; delete c.simKey; }); db.simsV = 2; }
db.vocab = db.vocab || ['Família', 'Casa', 'Comida', 'Economia', 'Objetos', 'Trabalho', 'Viagem', 'Saúde', 'Compras', 'Sentimentos'].map(name => ({ id: uid(), name, items: [] }));

let saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(() => LS.set(DB_KEY, db), 400); }
function saveNow() { clearTimeout(saveT); LS.set(DB_KEY, db); }
addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

const tmpSents = new Map(); // frases temporárias (contexto, revisão)
function findSent(sid) {
  for (const c of db.cards) {
    if (c.main.id === sid) return { s: c.main, card: c, isMain: true };
    const s = c.ex.find(x => x.id === sid); if (s) return { s, card: c };
  }
  for (const t of db.terms) { const s = (t.ex || []).find(x => x.id === sid); if (s) return { s, term: t }; }
  for (const t of db.vocab) for (const v of t.items) {
    if (v.s.id === sid) return { s: v.s, vocab: v };
    const s = v.ex.find(x => x.id === sid); if (s) return { s, vocab: v };
  }
  const s = tmpSents.get(sid); return s ? { s, tmp: true } : null;
}
const cardById = id => db.cards.find(c => c.id === id);
const termById = id => db.terms.find(t => t.id === id);

/* ================= Theme ================= */
// Cada cor tem um tom para fundo claro e outro para fundo escuro, para continuar legível ao trocar de tema
const TEXT_COLORS = { blue: ['#1d4ed8', '#93c5fd'], red: ['#b91c1c', '#fca5a5'], green: ['#15803d', '#86efac'], orange: ['#b45309', '#fcd34d'], purple: ['#7e22ce', '#d8b4fe'], teal: ['#0e7490', '#67e8f9'] };
const textColor = v => { const p = TEXT_COLORS[v]; return p ? p[document.documentElement.dataset.theme === 'dark' ? 1 : 0] : v; };
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = S.theme === 'auto' ? (mq.matches ? 'dark' : 'light') : S.theme;
  const r = document.documentElement;
  r.dataset.theme = t;
  r.style.setProperty('--fs', S.fs + 'px');
  if (S.mainBg) r.style.setProperty('--main-bg', hexA(textColor(S.mainBg), t === 'dark' ? .24 : .13)); else r.style.removeProperty('--main-bg');
  [['--main-c', S.mainColor], ['--sec-c', S.secColor]].forEach(([k, v]) => v ? r.style.setProperty(k, textColor(v)) : r.style.removeProperty(k));
  r.style.setProperty('--accent', S.accent);
  r.style.setProperty('--accent-soft', hexA(S.accent, t === 'dark' ? .22 : .12));
  r.style.setProperty('--sel', hexA(S.accent, .28));
  const bg = getComputedStyle(r).getPropertyValue('--bg').trim();
  $('meta[name=theme-color]').setAttribute('content', bg);
}
mq.addEventListener ? mq.addEventListener('change', applyTheme) : mq.addListener(applyTheme);
applyTheme();

/* ================= Toast / sheets ================= */
let toastT, undoFn = null;
function toast(msg, o = {}) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${o.undo ? '<button data-act="undo">Desfazer</button>' : ''}`;
  t.classList.add('show'); undoFn = o.undo || null;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.remove('show'); undoFn = null; }, o.undo ? 6000 : (o.ms || 2800));
}
const sheets = [];
function openSheet(html, o = {}) {
  const ov = document.createElement('div');
  ov.className = 'sheet-ov';
  ov.innerHTML = `<div class="sheet ${o.cls || ''}" role="dialog" aria-modal="true"><div class="sheet-head"><div class="grab"></div><button class="ib sheet-x" data-act="close-sheet" aria-label="Fechar">${I.x}</button></div><div class="sheet-body">${html}</div></div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('open')));
  ov.addEventListener('click', e => { if (e.target === ov) closeSheet(); });
  const sh = { ov, body: ov.querySelector('.sheet-body'), onClose: o.onClose };
  sheets.push(sh); document.body.classList.add('noscroll');
  return sh;
}
function closeSheet() {
  const sh = sheets.pop(); if (!sh) return;
  sh.ov.classList.remove('open');
  setTimeout(() => sh.ov.remove(), 280);
  sh.onClose && sh.onClose();
  if (!sheets.length) document.body.classList.remove('noscroll');
}
function closeAllSheets() { while (sheets.length) closeSheet(); }
function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.html = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${label ? esc(label) : ''}`; }
  else if (btn.dataset.html != null) { btn.innerHTML = btn.dataset.html; btn.disabled = false; delete btn.dataset.html; }
}

/* ================= Words: render / bold ================= */
function parseSent(text) {
  const toks = [], re = /\*\*(.+?)\*\*/g; let last = 0, m;
  const push = (str, b) => str.split(/(\s+)/).forEach(p => { if (p) toks.push({ t: p, b, sp: /^\s+$/.test(p) }); });
  while ((m = re.exec(text))) { push(text.slice(last, m.index), false); push(m[1], true); last = re.lastIndex; }
  push(text.slice(last), false);
  return toks;
}
function effBold(toks) {
  return toks.map((k, i) => {
    if (!k.sp) return k.b;
    let p = i - 1, n = i + 1;
    while (p >= 0 && toks[p].sp) p--;
    while (n < toks.length && toks[n].sp) n++;
    return p >= 0 && n < toks.length && toks[p].b && toks[n].b;
  });
}
function serialize(toks) {
  const e = effBold(toks); let out = '', run = '';
  toks.forEach((k, i) => {
    if (e[i]) run += k.t;
    else { if (run) { out += '**' + run + '**'; run = ''; } out += k.t; }
  });
  if (run) out += '**' + run + '**';
  return out;
}
function wordsHTML(text) {
  const toks = parseSent(text), e = effBold(toks);
  return toks.map((k, i) => k.sp ? (e[i] ? `<span class="sp b" data-i="${i}">${k.t}</span>` : `<span class="sp" data-i="${i}">${k.t}</span>`)
    : `<span class="w${k.b ? ' b' : ''}" data-i="${i}">${esc(k.t)}</span>`).join('');
}
// Versão leve para exibir: texto puro + <b> nos destaques (bem menos elementos na página)
function textHTML(text) {
  return esc(String(text || '')).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
// Troca o texto leve pelos spans por palavra (necessário para tocar/deslizar). Feito só na frase tocada.
function wordify(en) {
  if (!en || en.dataset.w) return;
  const sentEl = en.closest('.sent'), f = sentEl && findSent(sentEl.dataset.sid);
  if (!f) return;
  en.innerHTML = wordsHTML(f.s.en); en.dataset.w = '1';
}
const boldTerms = text => { const r = [], re = /\*\*(.+?)\*\*/g; let m; while ((m = re.exec(text))) r.push(m[1].trim()); return [...new Set(r)]; };
const cleanTerm = t => String(t || '').replace(/\*\*/g, '').replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '').trim();
function highlightTerm(sentence, term) {
  const p = plain(sentence), t = cleanTerm(term);
  if (!t) return esc(p);
  const i = p.toLowerCase().indexOf(t.toLowerCase());
  if (i < 0) return esc(p);
  return esc(p.slice(0, i)) + '<mark>' + esc(p.slice(i, i + t.length)) + '</mark>' + esc(p.slice(i + t.length));
}

/* ================= Translation ================= */
const trCache = new Map();
async function translate(text, to = 'pt') {
  const q = plain(text); if (!q) return '';

    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(q)}`);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    out = (j[0] || []).map(x => x[0]).join('');
  } catch {
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${from}|${to === 'pt' ? 'pt-BR' : 'en'}`);
    const j = await r.json();
    out = j.responseData?.translatedText || '';

      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      u.rate = S.rate;

// A lista é montada aos poucos (PAGE cards por vez) conforme a rolagem: abre rápido mesmo com centenas de cards
const PAGE = 25;

  const box = $('#cards'), more = $('#moreCards'); if (!more) return;

function openAdd() {

async function createCards(btn) {
  const lines = splitLines($('#addTa').value);
  if (!lines.length) return;
  const useAI = $('#addAI').checked && hasAI();
  const made = lines.map(l => newCard(l));
  let completed = 0, failed = false;
  if (useAI) {
    busy(btn, true, ' Completando frases…');
    for (let i = 0; i < lines.length; i += 15) {
      const chunk = lines.slice(i, i + 15);
      try {
        const r = await askAI(promptComplete(chunk.map(plain), false));
        const items = r.items || r;
        if (Array.isArray(items) && items.length === chunk.length) items.forEach((it, j) => {
          const c = made[i + j];
          if (it && it.completed && it.en && plain(it.en).toLowerCase() !== plain(chunk[j]).toLowerCase()) { c.src = plain(chunk[j]); c.main.en = cleanAI(it.en); completed++; }
          if (it && it.pt) c.main.tr = plain(it.pt);
        });
      } catch (e) { failed = true; if (e.nokey) break; console.warn(e); }
    }
    busy(btn, false);
  }
  db.cards.unshift(...made);
  save(); closeSheet();
  query = ''; $('#search').value = '';
  if (curView !== 'cards') show('cards'); else renderCards();
  scrollTo({ top: 0, behavior: 'smooth' });
  made.forEach(c => $(`.card[data-card="${c.id}"]`)?.classList.add('flash'));
  toast(`${made.length} card${made.length > 1 ? 's' : ''} criado${made.length > 1 ? 's' : ''}` + (completed ? ` · ${completed} completado${completed > 1 ? 's' : ''} com contexto` : '') + (failed ? ' · IA indisponível em parte' : ''), {
    undo: () => { db.cards = db.cards.filter(c => !made.includes(c)); save(); renderCards(); }
  });
}

/* ---------- Card actions ---------- */
async function genExamples(c, btn) {
  if (!hasAI()) return needAI();
  busy(btn, true, ' Gerando…');
  try {
    const known = cardKey(c), plan = known.list.map(x => x.term).slice(0, 3);
    const r = await askAI(promptExamples({ term: known.term, hint: known.hint, sentence: c.main.en, plan, existing: [c.main.en, ...c.ex.map(x => x.en)] }));
    const key = known.term || plain(r.key || '');
    const arr = readExamples(r, plan, key);
    if (!arr.length) throw new Error('A IA não retornou exemplos.');
    c.collapsed = false;
    arr.forEach(x => { x.fresh = 1; c.ex.push(x); });
    if (key && plan.length < 3) {
      const added = arr.filter(x => x.alt && !plan.some(p => norm(p) === norm(x.alt))).map(x => ({ term: x.alt, note: '' }));
      rememberSims(c, [key], [...known.list, ...added]);
    }
    save();
    rerenderCard(c);
    toast(`${arr.length} exemplos novos`);
  } catch (e) { busy(btn, false); aiError(e); }
}

/* ---------- Context sheet ---------- */
let ctx = null;
const ctxCache = new Map();
function openContext(term, sentEn, sid) {
  term = cleanTerm(term);
  if (!term) return;
  const f = sid ? findSent(sid) : null;
  ctx = { term, via: null, sent: sentEn || '', cardId: f && f.card ? f.card.id : null, isMain: !!(f && f.isMain), data: null };
  openSheet(`<div class="sheet-title">Contexto</div>
    <form class="term-form" id="ctxForm"><input class="input" id="ctxIn" value="${esc(term)}" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Termo"><button class="pill accent" type="submit">Ver</button></form>
    <p class="hint" style="margin:6px 2px 0">Edite para ver um termo maior (ex.: “get the hang of”).</p>
    ${sentEn ? `<div class="ctx-sent" id="ctxSent">${highlightTerm(sentEn, term)}</div>` : ''}
    <div id="ctxBody"></div>`, { onClose: () => { ctx = null; } });
  $('#ctxForm').addEventListener('submit', e => { e.preventDefault(); const t = cleanTerm($('#ctxIn').value); if (!t || !ctx) return; $('#ctxIn').blur(); ctx.term = t; ctx.via = null; if ($('#ctxSent')) $('#ctxSent').innerHTML = highlightTerm(ctx.sent, t); loadContext(); });
  loadContext();
}
async function loadContext() {
  const body = $('#ctxBody'); if (!body || !ctx) return;
  const my = ctx;
  const key = my.term.toLowerCase() + '|' + plain(my.sent) + '|' + (my.via || '');
  body.innerHTML = `<div class="loading"><span class="spin"></span>Buscando “${esc(my.term)}”…</div>`;
  try {
    let data = ctxCache.get(key);
    if (!data) {
      if (hasAI()) {
        const r = await askAI(promptContext(my.term, my.sent, my.via)).catch(() => null);
        if (r) {
          const similar = (Array.isArray(r.similar) ? r.similar : []).filter(x => x && x.term && norm(x.term) !== norm(my.term)).slice(0, 3).map(x => ({ term: plain(x.term), note: plain(x.note || '') }));
          data = { ai: true, term: plain(r.term || my.term), kind: r.kind || '', meaning: plain(r.meaning || ''), expl: r.explanation || '', mains: (Array.isArray(r.mains) ? r.mains : []).map(plain).filter(Boolean).slice(0, 4), uses: (Array.isArray(r.uses) ? r.uses : []).map(plain).filter(Boolean).slice(0, 3), similar, ex: (r.examples || []).filter(x => x && x.en).map(x => newSent(cleanAI(x.en), plain(x.pt || ''))) };
          ctxCache.set(key, data);
        }
      }
      if (!data) data = await dictLookup(my.term, my.sent);
    }
    const card = data.ai && !my.via && my.cardId ? cardById(my.cardId) : null;
    if (card) {
      const known = card.sims && (card.sims[norm(my.term)] || card.sims[norm(data.term)]);
      if (known) data.similar = [...known.list, ...data.similar.filter(x => !known.list.some(k => norm(k.term) === norm(x.term)))].slice(0, 3);
      if (data.similar.length && (known || my.isMain)) { rememberSims(card, [my.term, data.term], data.similar); save(); }
    }
    if (ctx !== my) return;
    my.data = data;
    renderContext();
  } catch (e) {
    if (ctx !== my) return;
    body.innerHTML = `<div class="ctx-card"><b>Não consegui carregar.</b><div class="hint">${esc(e.nokey ? 'Configure a IA em Ajustes.' : (e.message || 'Erro'))}</div><button class="pill" data-act="ctx-retry">Tentar de novo</button></div>`;
  }
}
// Sem IA: dicionário gratuito do Google Tradutor (tradução, sentidos, definições e exemplos)
async function dictLookup(term, sent) {
  const POS = { verb: 'verbo', noun: 'substantivo', adjective: 'adjetivo', adverb: 'advérbio', preposition: 'preposição', pronoun: 'pronome', conjunction: 'conjunção', interjection: 'interjeição', phrase: 'expressão', 'phrasal verb': 'phrasal verb' };
  let j = [];
  try { j = await (await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=pt&dt=t&dt=bd&dt=md&dt=ex&q=${encodeURIComponent(term)}`)).json(); } catch {}
  const meaning = (j[0] || []).map(x => x[0]).join('') || await translate(term).catch(() => '');
  const list = (j[1] || []).map(p => `${POS[p[0]] || p[0]}: ${(p[1] || []).slice(0, 5).join(', ')}`);
  const mains = list.length ? list : meaning ? [meaning] : [];
  const ctxTr = sent ? await translate(sent).catch(() => '') : '';
  const defs = [];
  (j[12] || []).forEach(p => (p[1] || []).slice(0, 2).forEach(d => defs.length < 4 && defs.push({ pos: POS[p[0]] || p[0], s: newSent(d[0]) })));
  const ex = (j[13]?.[0] || []).slice(0, 4).map(e => newSent(String(e[0]).replace(/<b>(.*?)<\/b>/g, '**$1**').replace(/<[^>]+>/g, '')));
  return { ai: false, term, kind: (j[1]?.[0]?.[0] && (POS[j[1][0][0]] || j[1][0][0])) || '', meaning, mains, ctxTr, defs, ex };
}
// Principais significados do termo isolado + significado na frase. Termos salvos antes disso não têm a lista.

  const inCtx = d.ctxTr || (hasCtx ? d.meaning : '');
  return `<div class="ctx-sub">Principais significados</div><ul class="ctx-mains">${mains.map(m => `<li>${esc(m)}</li>`).join('')}</ul>`
    + (d.uses && d.uses.length ? `<div class="ctx-sub">Principais contextos de uso</div><ul class="ctx-mains">${d.uses.map(m => `<li>${esc(m)}</li>`).join('')}</ul>` : '')
    + (inCtx ? `<div class="ctx-sub">Neste contexto</div><div class="${meanCls}">${esc(inCtx)}</div>` : '') + expl;
}

  const extra = card ? `<button class="ib" data-act="ex-to-card" aria-label="Adicionar ao card">${I.plus}</button>` : '';
  body.innerHTML = `<div class="ctx-card">
      <div class="ctx-term"><h3 lang="en">${esc(d.term)}</h3>${d.kind ? `<span class="badge">${esc(d.kind)}</span>` : ''}<span style="flex:1"></span><button class="ib" data-act="speak-ctx-term" aria-label="Ouvir">${I.vol}</button></div>

/* ---------- Review ---------- */
const DAY = 864e5;
function reviewCounts(src) {
  const list = src === 'terms' ? db.terms : db.cards, now = Date.now();
  const due = list.filter(x => x.rv && x.rv.due <= now).length;
  const fresh = list.filter(x => !x.rv).length;
  const st = db.stats[src] || {};
  const left = Math.max(0, S.newPerDay - (st.day === today() ? st.newCount : 0));
  return { due, fresh, newToday: Math.min(fresh, left), total: due + Math.min(fresh, left) };
}
function nextRv(rv, g) {
  rv = rv || { ivl: 0, ease: 2.5, reps: 0, lapses: 0 };
  const ease = Math.max(1.3, rv.ease + [-0.2, -0.15, 0, 0.15][g]);
  let ivl;
  if (g === 0) ivl = 0;
  else if (!rv.reps || !rv.ivl) ivl = [0, 1, 3, 5][g];
  else ivl = Math.max(rv.ivl + 1, Math.round(g === 1 ? rv.ivl * 1.2 : g === 2 ? rv.ivl * rv.ease : rv.ivl * rv.ease * 1.4));
  return { ivl, ease, reps: g === 0 ? 0 : rv.reps + 1, lapses: rv.lapses + (g === 0 ? 1 : 0), due: g === 0 ? Date.now() + 60e3 : Date.now() + ivl * DAY, last: Date.now() };
}
const fmtIvl = d => d === 0 ? '1 min' : d < 30 ? `${d} d` : d < 365 ? `${Math.round(d / 30)} m` : `${(d / 365).toFixed(1)} a`;
let R = null;
function startReview(free) {
  const src = S.revSrc, list = src === 'terms' ? db.terms : db.cards, now = Date.now();
  let q;
  if (free) q = [...list].sort(() => Math.random() - .5).slice(0, 20);
  else {
    const c = reviewCounts(src);
    q = list.filter(x => x.rv && x.rv.due <= now).sort((a, b) => a.rv.due - b.rv.due).concat(c.newToday ? list.filter(x => !x.rv).slice(-c.newToday).reverse() : []);
  }
  if (!q.length) return toast(free ? 'Nada para revisar.' : 'Nenhum pendente agora 🎉');
  R = { src, q, total: q.length, done: 0, ok: 0, shown: false, free };
  renderReview();
}
function rvFace(item, side) {
  const dir = S.revDir;
  if (R.src === 'terms') {
    if (side === 'front') return dir === 'en'
      ? `<div class="rv-front" lang="en">${esc(item.term)}</div>${item.ctx ? `<div class="ctx-sent small">${highlightTerm(item.ctx, item.term)}</div>` : ''}<div class="row-btns"><button class="pill" data-act="rv-speak">${I.vol} Ouvir</button></div>`
      : `<div class="rv-front pt">${esc(item.meaning || '(sem significado salvo)')}</div><p class="hint">Qual é o termo em inglês?</p>`;
    return `${dir === 'pt' ? `<div class="rv-front" lang="en">${esc(item.term)}</div>` : `<div class="term-mean">${esc(item.meaning)}</div>`}
      ${item.expl ? `<div class="term-expl">${esc(item.expl)}</div>` : ''}
      ${item.ex.length ? `<div class="ex-wrap">${item.ex.map(s => sentHTML(s, { cls: 'ex' })).join('')}</div>` : ''}`;
  }
  if (side === 'front') return dir === 'en'
    ? `<div class="sent main" data-sid="${item.main.id}"><div class="en rv-front" lang="en">${textHTML(item.main.en)}</div></div><div class="row-btns"><button class="pill" data-act="rv-speak">${I.vol} Ouvir</button></div><p class="hint">Você entende? Tente traduzir mentalmente.</p>`
    : `<div class="rv-front pt" id="rvPt">${item.main.tr ? esc(plain(item.main.tr)) : '<span class="muted">Traduzindo…</span>'}</div><p class="hint">Como você diria isso em inglês? Fale em voz alta.</p>`;
  return `${dir === 'en' ? `<div class="sent main" data-sid="${item.main.id}"><div class="tr" style="margin-top:0">${trInner(item.main)}</div></div>`
      : `<div class="sent main" data-sid="${item.main.id}"><div class="en rv-front" lang="en">${textHTML(item.main.en)}</div><div class="main-tools"><button class="pill" data-act="speak">${I.vol} Ouvir</button></div></div>`}
    ${item.note ? `<details class="note" open><summary>Nota</summary><div>${esc(item.note)}</div></details>` : ''}
    ${item.ex.length ? `<div class="ex-wrap"><div class="ex-label">Exemplos</div>${item.ex.map(s => sentHTML(s, { cls: 'ex' })).join('')}</div>` : ''}`;
}
function renderReview() {
  const v = $('#view-review');
  if (!R) {
    const c = reviewCounts(S.revSrc), n = (S.revSrc === 'terms' ? db.terms : db.cards).length;
    v.innerHTML = `
      <div class="seg" style="margin-top:4px">${[['cards', 'Cards'], ['terms', 'Termos']].map(([k, l]) => `<button class="${S.revSrc === k ? 'on' : ''}" data-act="rv-src" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="stats"><div class="stat"><b>${c.due}</b><span>Pendentes</span></div><div class="stat"><b>${c.newToday}</b><span>Novos hoje</span></div><div class="stat"><b>${n}</b><span>Total</span></div></div>
      <button class="btn primary" data-act="rv-start" ${c.total ? '' : 'disabled'}>${c.total ? `Começar revisão (${c.total})` : 'Tudo revisado por hoje 🎉'}</button>
      <button class="btn" data-act="rv-free" ${n ? '' : 'disabled'}>Revisão livre (20 aleatórios)</button>
      <div class="group-title">Como revisar</div>
      <div class="group">
        <div class="set-row"><div class="lbl">Direção</div><div class="seg" style="width:190px">${[['en', 'EN → PT'], ['pt', 'PT → EN']].map(([k, l]) => `<button class="${S.revDir === k ? 'on' : ''}" data-act="rv-dir" data-v="${k}">${l}</button>`).join('')}</div></div>
        <div class="set-row"><div class="lbl">Tocar áudio automaticamente</div><label class="switch"><input type="checkbox" data-set="revAuto" ${S.revAuto ? 'checked' : ''}><span></span></label></div>
        <div class="set-row"><div class="lbl">Novos por dia<small>Cards que entram na revisão pela 1ª vez</small></div><select data-set="newPerDay">${[5, 10, 15, 20, 30, 50, 100].map(x => `<option ${S.newPerDay === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      </div>
      <p class="hint">Repetição espaçada: quanto melhor você responde, mais tempo até o card voltar.</p>`;
    return;
  }
  const item = R.q[0];
  if (!item) {
    v.innerHTML = `<div class="empty"><h3>Revisão concluída 🎉</h3>${R.done} respostas · ${R.ok} acertos<br><button class="pill accent" data-act="rv-exit">Voltar</button></div>`;
    R = null; renderTabs(); return;
  }
  const btns = [0, 1, 2, 3].map(g => `<button class="g${g}" data-act="rv-rate" data-g="${g}">${['Errei', 'Difícil', 'Bom', 'Fácil'][g]}<small>${fmtIvl(nextRv(item.rv, g).ivl)}</small></button>`).join('');
  v.innerHTML = `<div class="rv-meta"><span>${R.done}/${R.total}${R.free ? ' · livre' : ''}</span><button class="pill ghost" data-act="rv-exit" style="height:auto">Sair</button></div>
    <div class="rv-progress"><i style="width:${Math.round(R.done / Math.max(R.total, 1) * 100)}%"></i></div>
    <div class="rv-card">${rvFace(item, 'front')}${R.shown ? `<div class="rv-back">${rvFace(item, 'back')}</div>` : ''}</div>
    ${R.shown ? `<div class="rv-rate">${btns}</div>` : `<button class="btn primary" data-act="rv-show">Mostrar resposta</button>`}`;
  if (R.src === 'cards') {
    if (S.revDir === 'pt' && !item.main.tr) ensureTr(item.main).then(() => { const el = $('#rvPt'); if (el) el.innerHTML = item.main.tr ? esc(plain(item.main.tr)) : '<span class="err">Sem tradução (offline?). Mostre a resposta.</span>'; });
    if (R.shown) { if (S.revDir === 'en') ensureTr(item.main); }
  }
  if (S.revAuto && ((S.revDir === 'en' && !R.shown) || (S.revDir === 'pt' && R.shown))) rvSpeak(item);
}
function rvSpeak(item) { speak(R.src === 'terms' ? [item.term] : [{ text: item.main.en, id: item.main.id }]); }
function rvRate(g) {
  const item = R.q.shift(), wasNew = !item.rv;
  item.rv = nextRv(item.rv, g);
  if (wasNew) { const st = db.stats[R.src] || {}; if (st.day !== today()) { st.day = today(); st.newCount = 0; } st.newCount++; db.stats[R.src] = st; }
  R.done++; if (g > 0) R.ok++;
  if (g === 0) { R.q.splice(Math.min(3, R.q.length), 0, item); R.total++; }
  R.shown = false; save(); renderReview(); renderTabs();
}

/* ---------- Backup ---------- */
function backupData() { return { app: 'english-pro', v: 2, exported: new Date().toISOString(), cards: db.cards, terms: db.terms, vocab: db.vocab, stats: db.stats }; }
function backupFile() {
  const name = `english-pro-backup-${today()}.json`;
  return { name, blob: new Blob([JSON.stringify(backupData())], { type: 'application/json' }) };
}
function markBackup() { S.lastBackup = Date.now(); saveS(); if (curView === 'settings') renderSettings(); }
async function backupShare() {
  const { name, blob } = backupFile();
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Backup English Pro' }); markBackup(); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  backupDownload();
}
function backupDownload() {
  const { name, blob } = backupFile();
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  markBackup();
}
function normalizeImport(data) {
  if (Array.isArray(data)) return { cards: data.map(o => o && o.main ? o : migrateOldCard(o)).filter(Boolean), terms: [] };
  if (data && Array.isArray(data.cards)) return { cards: data.cards.map(o => o && o.main ? o : migrateOldCard(o)).filter(Boolean), terms: Array.isArray(data.terms) ? data.terms : [], vocab: Array.isArray(data.vocab) ? data.vocab : null, stats: data.stats };
  throw new Error('Formato não reconhecido');
}
function mergeIn(inc) {
  const have = new Set(db.cards.map(c => norm(c.main.en)));
  const haveT = new Set(db.terms.map(t => norm(t.term)));
  const ids = new Set(db.cards.map(c => c.id));
  let nc = 0, nt = 0;
  const add = inc.cards.filter(c => { const k = norm(c.main.en); if (have.has(k)) return false; have.add(k); return true; });
  add.forEach(c => { if (ids.has(c.id)) c.id = uid(); nc++; });
  db.cards.push(...add);
  inc.terms.forEach(t => { const k = norm(t.term); if (!haveT.has(k)) { haveT.add(k); db.terms.push(Object.assign({ ex: [] }, t)); nt++; } });
  (inc.vocab || []).forEach(t => {
    let mine = db.vocab.find(x => norm(x.name) === norm(t.name));
    if (!mine) { mine = { id: uid(), name: t.name, items: [] }; db.vocab.push(mine); }
    (t.items || []).forEach(v => { if (!mine.items.some(x => norm(x.term) === norm(v.term))) mine.items.push(v); });
  });
  return { nc, nt };
}
function offerImport(inc, label) {
  const sh = openSheet(`<div class="sheet-title">Importar</div>
    <p>${esc(label)}: <b>${inc.cards.length}</b> cards e <b>${inc.terms.length}</b> termos.</p>
    <button class="btn primary" data-act="imp-merge">Juntar com os atuais (sem duplicar)</button>
    <button class="btn danger" data-act="imp-replace">Substituir tudo</button>
    <p class="hint">Antes de substituir, um backup do que você tem agora é guardado automaticamente neste aparelho.</p>`);
  sh.inc = inc;
}
function doImport(mode) {
  const sh = sheets[sheets.length - 1], inc = sh && sh.inc; if (!inc) return;
  const snap = JSON.stringify(db);
  if (mode === 'replace') {
    if (!confirm('Substituir todos os cards e termos atuais pelos do backup?')) return;
    LS.setRaw('englishPro2_beforeRestore', snap);
    db.cards = inc.cards; db.terms = inc.terms; if (inc.vocab) db.vocab = inc.vocab; if (inc.stats) db.stats = inc.stats;
    save(); closeSheet(); renderAll(); toast(`Restaurado: ${db.cards.length} cards, ${db.terms.length} termos`, { undo: () => { db = JSON.parse(snap); save(); renderAll(); } });
  } else {
    const r = mergeIn(inc); save(); closeSheet(); renderAll();
    toast(`${r.nc} cards e ${r.nt} termos adicionados`, { undo: () => { db = JSON.parse(snap); save(); renderAll(); } });
  }
}
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { offerImport(normalizeImport(JSON.parse(rd.result)), f.name); } catch (err) { toast('Arquivo inválido: ' + err.message); } };
  rd.readAsText(f);
});
function renderAll() { show(curView); }

/* ================= Interactions: swipe-to-bold & tap ================= */
let sw = null, swallowClick = false;
function paintSel() {
  const a = Math.min(sw.start, sw.cur), b = Math.max(sw.start, sw.cur);
  if (sw.painted === a + ':' + b) return;
  sw.painted = a + ':' + b;
  for (const e of sw.en.children) { const i = +e.dataset.i; e.classList.toggle('sel', i >= a && i <= b); }
}
function wordAt(en, x, y) {
  const el = document.elementFromPoint(x, y), w = el && el.closest && el.closest('[data-i]');
  return w && en.contains(w) ? w : null;
}
document.addEventListener('pointerdown', e => {
  sw = null;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const en = e.target.closest && e.target.closest('.en'); if (!en) return;
  wordify(en);
  const w = wordAt(en, e.clientX, e.clientY); if (!w) return;
  sw = { en, start: +w.dataset.i, cur: +w.dataset.i, x: e.clientX, y: e.clientY, pid: e.pointerId, active: false };
}, { passive: true });
document.addEventListener('pointermove', e => {
  if (!sw || e.pointerId !== sw.pid) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.active) {
    if (Math.abs(dx) > 9 && Math.abs(dx) > Math.abs(dy) * 1.1) { sw.active = true; try { sw.en.setPointerCapture(e.pointerId); } catch {} }
    else if (Math.abs(dy) > 12) { sw = null; return; }
    else return;
  }
  const w = wordAt(sw.en, e.clientX, e.clientY);
  if (w) sw.cur = +w.dataset.i;
  paintSel();
}, { passive: true });
function endSwipe(e) {
  if (!sw || e.pointerId !== sw.pid) return;
  const s = sw; sw = null;
  if (!s.active) return;
  swallowClick = true; setTimeout(() => swallowClick = false, 400);
  $$('.sel', s.en).forEach(x => x.classList.remove('sel'));
  if (e.type === 'pointercancel') return;
  const sentEl = s.en.closest('.sent'); const f = sentEl && findSent(sentEl.dataset.sid); if (!f) return;
  const toks = parseSent(f.s.en), a = Math.min(s.start, s.cur), b = Math.max(s.start, s.cur);
  const words = toks.map((k, i) => i).filter(i => i >= a && i <= b && !toks[i].sp);
  if (!words.length) return;
  const allBold = words.every(i => toks[i].b);
  words.forEach(i => toks[i].b = !allBold);
  f.s.en = serialize(toks);
  if (!f.tmp) save();
  $$(`.sent[data-sid="${f.s.id}"] > .en,.sent[data-sid="${f.s.id}"] .sent-row > .en`).forEach(en => { en.innerHTML = wordsHTML(f.s.en); en.dataset.w = '1'; });
  if (!S.tipDone) { S.tipDone = true; saveS(); }
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);
// Impede o "arrastar" nativo de texto/imagem no desktop enquanto destaca
document.addEventListener('dragstart', e => { if (e.target.closest && e.target.closest('.en')) e.preventDefault(); });

function termAt(wEl) {
  const en = wEl.closest('.en'), sentEl = en.closest('.sent');
  const f = sentEl && findSent(sentEl.dataset.sid);
  const text = f ? f.s.en : en.textContent;
  const toks = parseSent(text), i = +wEl.dataset.i;
  if (!toks[i]) return { term: wEl.textContent, sent: text, sid: sentEl && sentEl.dataset.sid };
  if (!toks[i].b) return { term: toks[i].t, sent: text, sid: sentEl.dataset.sid };
  let a = i, b = i;
  while (a - 1 >= 0 && (toks[a - 1].b || (toks[a - 1].sp && a - 2 >= 0 && toks[a - 2].b))) a--;
  while (b + 1 < toks.length && (toks[b + 1].b || (toks[b + 1].sp && b + 2 < toks.length && toks[b + 2].b))) b++;
  return { term: toks.slice(a, b + 1).map(k => k.t).join(''), sent: text, sid: sentEl.dataset.sid };
}

/* ================= Click delegation ================= */
document.addEventListener('click', e => {
  if (swallowClick) { e.preventDefault(); e.stopPropagation(); swallowClick = false; return; }
  const enEl = !e.target.closest('[data-act]') && e.target.closest('.en');
  if (enEl) {
    wordify(enEl);
    const hit = wordAt(enEl, e.clientX, e.clientY), w = hit && hit.classList.contains('w') ? hit : null;
    if (!w) return;
    const t = termAt(w); if (sheets.length && ctx && w.closest('#ctxBody')) closeSheet(); openContext(t.term, t.sent, t.sid); return;
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const cardEl = b.closest('[data-card]'), card = cardEl && cardById(cardEl.dataset.card);
  const termEl = b.closest('[data-term]'), term = termEl && termById(termEl.dataset.term);
  const sentEl = b.closest('.sent'), fs = sentEl && findSent(sentEl.dataset.sid);
  switch (act) {
    case 'tab': closeAllSheets(); if (b.dataset.v === curView) scrollTo({ top: 0, behavior: 'smooth' }); else show(b.dataset.v); break;
    case 'close-sheet': closeSheet(); break;
    case 'undo': if (undoFn) { const f = undoFn; undoFn = null; $('#toast').classList.remove('show'); f(); } break;
    case 'stop': stopSpeak(); break;
    case 'add': openAdd(); break;
    case 'add-create': createCards(b); break;
    case 'toggle-search': { const sb = $('#searchbar'); sb.hidden = !sb.hidden; if (!sb.hidden) $('#search').focus(); else if (query) { query = ''; $('#search').value = ''; renderCards(); } renderTop(); break; }
    case 'clear-search': query = ''; $('#search').value = ''; renderCards(); $('#search').focus(); break;
    case 'toggle-showtr': S.showTr = !S.showTr; saveS(); if (!S.showTr) openTr.clear(); show(curView); break;
    case 'dismiss-tip': S.tipDone = true; saveS(); renderCards(); break;
    case 'dismiss-migration': migrationNote = ''; renderCards(); break;

    case 'speak': if (fs) speak([{ text: fs.s.en, id: fs.s.id }]); break;
    case 'tr': if (fs) {
      const open = !(S.showTr || openTr.has(fs.s.id));
      if (S.showTr && !open) { fs.s.trErr = false; if (!fs.s.tr) ensureTr(fs.s); break; }
      open ? openTr.add(fs.s.id) : openTr.delete(fs.s.id);
      const box = sentEl.querySelector(':scope > .tr'); box.hidden = !open; b.classList.toggle('on', open);
      if (open) { fs.s.trErr = false; box.innerHTML = trInner(fs.s); ensureTr(fs.s); }
    } break;
    case 'del-ex': if (fs) deleteSent(fs.s.id); break;
    case 'toggle-ex': if (card) { card.collapsed = !card.collapsed; save(); cardEl.classList.toggle('ex-closed', card.collapsed); b.setAttribute('aria-expanded', String(!card.collapsed)); } break;
    case 'play-all': if (card) speak([card.main, ...exOrdered(card)].map(s => ({ text: s.en, id: s.id }))); break;
    case 'tr-card': if (card) toggleTrCard(card); break;
    case 'gen': if (card) genExamples(card, b); break;
    case 'card-menu': if (card) cardMenu(card); break;
    case 'edit-card': closeSheet(); editCard(card); break;
    case 'complete-card': closeSheet(); completeCard(card); break;
    case 'tr-card-menu': closeSheet(); { const all = [card.main, ...card.ex]; all.forEach(s => openTr.add(s.id)); rerenderCard(card); all.forEach(ensureTr); } break;
    case 'copy-card': closeSheet(); {
      const txt = [card.main, ...card.ex].map(s => plain(s.en) + (s.tr ? '\n  ' + plain(s.tr) : '')).join('\n');
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copiado'), () => toast('Não foi possível copiar'));
    } break;
    case 'top-card': closeSheet(); { const i = db.cards.indexOf(card); db.cards.splice(i, 1); db.cards.unshift(card); save(); renderCards(); scrollTo({ top: 0, behavior: 'smooth' }); toast('Movido para o topo', { undo: () => { db.cards.splice(db.cards.indexOf(card), 1); db.cards.splice(i, 0, card); save(); renderCards(); } }); } break;
    case 'clear-ex': closeSheet(); { const old = card.ex; card.ex = []; save(); rerenderCard(card); toast('Exemplos apagados', { undo: () => { card.ex = old; save(); rerenderCard(card); } }); } break;
    case 'del-card': closeSheet(); deleteCard(card); break;
    case 'edit-add-ex': { const sh = sheets[sheets.length - 1]; $('#edEx').insertAdjacentHTML('beforeend', sh.exRow(null)); $('#edEx .edit-ex:last-child textarea').focus(); } break;
    case 'edit-del-ex': b.closest('.edit-ex').remove(); break;
    case 'edit-save': saveEdit(card); break;

    case 'ctx-retry': loadContext(); break;
    case 'ctx-similar': if (ctx) { ctx.via = ctx.via || (ctx.data && ctx.data.term) || ctx.term; ctx.term = b.dataset.term; $('#ctxIn').value = ctx.term; if ($('#ctxSent')) $('#ctxSent').innerHTML = highlightTerm(ctx.sent, ctx.via); $('#ctxIn').closest('.sheet-body').scrollTop = 0; loadContext(); } break;
    case 'ctx-back': if (ctx && ctx.via) { ctx.term = ctx.via; ctx.via = null; $('#ctxIn').value = ctx.term; if ($('#ctxSent')) $('#ctxSent').innerHTML = highlightTerm(ctx.sent, ctx.term); loadContext(); } break;
    case 'ctx-more': ctxMore(b); break;
    case 'ctx-save': ctxSave(); break;
    case 'speak-ctx-term': if (ctx && ctx.data) speak([ctx.data.term]); break;
    case 'ex-to-card': if (ctx && fs) { const c = cardById(ctx.cardId); if (c) { if (c.ex.some(s => plain(s.en) === plain(fs.s.en))) return toast('Já está no card'); c.ex.push(Object.assign(newSent(fs.s.en, fs.s.tr), { gen: 1 }, fs.s.alt ? { alt: fs.s.alt } : {})); save(); if (curView === 'cards') rerenderCard(c); b.innerHTML = I.check; b.disabled = true; toast('Adicionado ao card'); } } break;

    case 'speak-term': if (term) speak([term.term]); break;
    case 'term-play': if (term) speak([{ text: term.term }, ...term.ex.map(s => ({ text: s.en, id: s.id }))]); break;
    case 'term-more': if (term) termMore(term, b); break;
    case 'term-menu': if (term) termMenu(term); break;
    case 'term-del': if (term) { if (sheets.length) closeSheet(); const i = db.terms.indexOf(term); db.terms.splice(i, 1); save(); renderTerms(); renderTop(); renderTabs(); toast('Termo apagado', { undo: () => { db.terms.splice(i, 0, term); save(); renderTerms(); renderTop(); renderTabs(); } }); } break;
    case 'term-context': closeSheet(); openContext(term.term, term.ctx, null); break;
    case 'term-goto-card': closeSheet(); { const id = term.cardId; query = ''; $('#search').value = ''; show('cards'); ensureCardShown(id); const el = $(`.card[data-card="${id}"]`); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('flash'); } } break;

    case 'vocab-open': vocabOpen = b.dataset.id; renderVocab(); scrollTo(0, 0); break;
    case 'vocab-back': vocabOpen = null; stopSpeak(); renderVocab(); scrollTo(0, 0); break;
    case 'vocab-add-topic': topicSheet(null); break;
    case 'vocab-topic-menu': { const t = topicById(vocabOpen); if (t) openSheet(`<div class="menu-head">${esc(t.name)}</div><div class="menu"><button data-act="vocab-rename">${I.edit} Renomear campo</button><button data-act="vocab-del-topic" class="danger">${I.trash} Apagar campo</button></div>`); } break;
    case 'vocab-rename': closeSheet(); topicSheet(topicById(vocabOpen)); break;
    case 'vocab-del-topic': closeSheet(); {
      const t = topicById(vocabOpen), i = db.vocab.indexOf(t); if (!t) break;
      if (t.items.length && !confirm(`Apagar o campo "${t.name}" e suas ${t.items.length} dicas?`)) break;
      db.vocab.splice(i, 1); vocabOpen = null; save(); renderVocab(); renderTop();
      toast('Campo apagado', { undo: () => { db.vocab.splice(i, 0, t); vocabOpen = t.id; save(); if (curView === 'vocab') renderVocab(); renderTop(); } });
    } break;
    case 'vocab-gen': { const t = topicById(vocabOpen); if (t) vocabGen(t, b); } break;
    case 'vocab-more': case 'vocab-speak': case 'vocab-play': case 'vocab-del': {
      const v = findVocab(b.closest('[data-vocab]').dataset.vocab); if (!v) break;
      if (act === 'vocab-more') vocabMore(v, b);
      if (act === 'vocab-speak') speak([v.term]);
      if (act === 'vocab-play') speak([v.s, ...v.ex].map(x => ({ text: x.en, id: x.id })));
      if (act === 'vocab-del') {
        const t = db.vocab.find(x => x.items.includes(v)), i = t.items.indexOf(v);
        t.items.splice(i, 1); save(); renderVocab(); renderTop();
        toast('Dica apagada', { undo: () => { t.items.splice(i, 0, v); save(); if (curView === 'vocab') renderVocab(); renderTop(); } });
      }
    } break;

    case 'rv-src': S.revSrc = b.dataset.v; saveS(); renderReview(); break;
    case 'rv-dir': S.revDir = b.dataset.v; saveS(); renderReview(); break;
    case 'rv-start': startReview(false); break;
    case 'rv-free': startReview(true); break;
    case 'rv-show': R.shown = true; renderReview(); break;
    case 'rv-rate': rvRate(+b.dataset.g); break;
    case 'rv-speak': if (R && R.q[0]) rvSpeak(R.q[0]); break;
    case 'rv-exit': R = null; stopSpeak(); renderReview(); renderTabs(); break;

    case 'goto-settings': closeAllSheets(); show('settings'); break;
    case 'set-theme': S.theme = b.dataset.v; saveS(); applyTheme(); renderSettings(); break;
    case 'set-text-color': S[b.dataset.k] = b.dataset.v; saveS(); applyTheme(); renderSettings(); break;
    case 'set-accent': S.accent = b.dataset.v; saveS(); applyTheme(); renderSettings(); break;
    case 'test-voice': speak(["Hey! I'm running a little late, but I'll be there in ten minutes."]); break;
    case 'test-ai': busy(b, true); askAI('Return ONLY JSON: {"ok":true,"hello":"a short friendly greeting in English"}').then(r => toast(AI_INFO[lastAi].name + ' funcionando: ' + (r.hello || 'ok'))).catch(aiError).finally(() => busy(b, false)); break;
    case 'backup-share': backupShare(); break;
    case 'backup-download': backupDownload(); break;
    case 'backup-import': $('#fileIn').click(); break;
    case 'imp-merge': doImport('merge'); break;
    case 'imp-replace': doImport('replace'); break;
    case 'import-old': { const arr = readOldKey(b.dataset.k) || []; offerImport({ cards: arr.map(migrateOldCard).filter(Boolean), terms: [] }, 'Versão ' + b.dataset.k.replace('englishCardsFinal', '')); } break;
    case 'wipe-cards': if (db.cards.length && confirm(`Apagar TODOS os ${db.cards.length} cards?`)) { const old = db.cards; db.cards = []; save(); renderSettings(); renderTabs(); toast('Cards apagados', { undo: () => { db.cards = old; save(); renderSettings(); renderTabs(); } }); } break;
    case 'wipe-terms': if (db.terms.length && confirm(`Apagar TODOS os ${db.terms.length} termos?`)) { const old = db.terms; db.terms = []; save(); renderSettings(); renderTabs(); toast('Termos apagados', { undo: () => { db.terms = old; save(); renderSettings(); renderTabs(); } }); } break;
    case 'wipe-review': if (confirm('Zerar o progresso de revisão de todos os cards e termos?')) { const snap = JSON.stringify([db.cards.map(c => c.rv), db.terms.map(t => t.rv), db.stats]); [...db.cards, ...db.terms].forEach(x => delete x.rv); db.stats = {}; save(); renderTabs(); toast('Progresso zerado', { undo: () => { const [a, b2, st] = JSON.parse(snap); db.cards.forEach((c, i) => a[i] ? c.rv = a[i] : delete c.rv); db.terms.forEach((t, i) => b2[i] ? t.rv = b2[i] : delete t.rv); db.stats = st; save(); renderTabs(); } }); } break;
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheets.length) closeSheet(); });

/* Settings inputs */
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.set;
  if (el.dataset.color) { S[el.dataset.color] = el.value; saveS(); applyTheme(); }
  if (k === 'fs') { S.fs = +el.value; $('#fsVal').textContent = S.fs + 'px'; applyTheme(); saveS(); }
  if (k === 'rate') { S.rate = +el.value; $('#rateVal').textContent = S.rate.toFixed(2) + 'x'; saveS(); }
  if (el.id === 'search') { clearTimeout(window._qt); window._qt = setTimeout(() => { query = el.value.trim(); renderCards(true); }, 200); }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.set;
  if (el.dataset.color) { renderSettings(); return; }
  if (el.dataset.key) { LS.setRaw(el.dataset.key, el.value.trim()); Object.keys(AI_INFO).forEach(p => { if (AI_INFO[p].key === el.dataset.key) aiCool(p, 0); }); if (curView === 'settings') renderSettings(); toast('Chave salva'); return; }
  if (!k || k === 'fs' || k === 'rate') return;
  if (el.type === 'checkbox') S[k] = el.checked;
  else if (k === 'newPerDay') S[k] = +el.value;
  else S[k] = el.value;
  saveS();
  if (k === 'voice') speak(['This is my voice.']);
  if (k === 'showTr') { openTr.clear(); renderTop(); }
  if (k === 'ai' || k === 'aiFree') renderSettings();
  if (k === 'newPerDay') { renderReview(); renderTabs(); }
});

/* Scroll: borda do topo + lembrar posição */
let posT;
addEventListener('scroll', () => {
  $('#topbar').classList.toggle('scrolled', scrollY > 4);
  if (curView !== 'cards') return;
  clearTimeout(posT);
  posT = setTimeout(() => {
    const top = $('#topbar').offsetHeight;
    const el = $$('#cards .card').find(c => c.getBoundingClientRect().bottom > top + 10);
    if (el) LS.setRaw('ep2Pos', el.dataset.card);
  }, 250);
}, { passive: true });

/* ================= Boot ================= */
show('cards');
(() => {
  const id = LS.raw('ep2Pos'); if (!id) return;
  ensureCardShown(id);
  const el = $(`.card[data-card="${id}"]`); if (el && db.cards[0] && db.cards[0].id !== id) setTimeout(() => el.scrollIntoView({ block: 'start' }), 60);
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
